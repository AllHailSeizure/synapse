name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # No dependencies to install: the tests use only the Node and Python standard libraries.
      - name: JS tests
        run: node --test tests/*.mjs
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
